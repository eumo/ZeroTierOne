name: Build ZeroTier One - Static ARM64 (Native in QEMU)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ARM64 environment with QEMU
        uses: uraimo/run-on-arch-action@v2.5.0
        id: run-on-arch
        with:
          arch: aarch64
          distro: debian12
          run: |
            # 安装编译依赖
            apt update
            apt install -y build-essential git

            # 编译 ZeroTier（原生 ARM64）
            make STATIC=1 V=1

            # 验证
            file zerotier-one
            ./zerotier-one -v

            # 复制到共享目录
            cp zerotier-one /tmp/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-arm64-static
          path: /tmp/zerotier-one
          retention-days: 7
