name: Build ZeroTier One - Static ARM64

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential

      - name: Build static binary for ARM64
        run: |
          make STATIC=1 ARCH=arm64 V=1

      - name: Verify binary
        run: |
          file zerotier-one
          echo "Binary size: $(du -h zerotier-one)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-one-arm64-static
          path: ./zerotier-one
          retention-days: 7
